# Secrets come from environment variables (Secret Manager in production; names match).
# For local dev, put values in application-local.properties at the repo root (gitignored) —
# copy application-local.properties.example to get started.
spring.config.import=optional:file:./application-local.properties
spring.application.name=pulse-api

# Database (local default = the pulse-pg Docker container on 55432)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/pulse}
spring.datasource.username=${DB_USER:pulse}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway is authoritative from V1 (hard rule 6). Hibernate only validates the mapping so
# entity/DDL drift fails startup instead of being silently "fixed".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# API docs: OFF unless explicitly enabled (a public swagger maps the whole attack surface).
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# Resolution order: SERVER_PORT (explicit override) > PORT (injected by Cloud Run) > 8090
# (8081 is bookr-api, 8080 is Apache httpd on the dev machine).
server.port=${SERVER_PORT:${PORT:8090}}
# Trust X-Forwarded-* from Cloud Run's proxy so request.isSecure() is true (enables HSTS)
server.forward-headers-strategy=framework
# Request id in every log line (MDC, set by RequestIdFilter)
logging.pattern.level=%5p [rid:%X{requestId:-}]

# Rate limiter source IP: which X-Forwarded-For entry is the real client. Cloud Run APPENDS
# the connecting IP, so 1 = plain Cloud Run, 2 = behind an external HTTPS LB, 0 = no proxy.
# Windows are in process memory, so keep the service at --max-instances=1.
app.rate-limit.trusted-proxy-hops=${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}

# CORS (comma-separated origin patterns). Prod must set CORS_ALLOWED_ORIGINS to exact origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- Auth -------------------------------------------------------------------------------
# HS256 signing key, at least 32 bytes. No default — the app must not start with a known key.
app.jwt.secret=${PULSE_JWT_SECRET:}
app.jwt.ttl-seconds=43200
# The one Google account allowed to sign in, and the OAuth client id used to check aud.
app.auth.allowed-email=${PULSE_ALLOWED_EMAIL:}
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}

# --- /internal/jobs auth ------------------------------------------------------------------
# Cloud Scheduler OIDC: aud == PULSE_API_BASE_URL, email == SCHEDULER_SA_EMAIL.
app.jobs.base-url=${PULSE_API_BASE_URL:}
app.jobs.scheduler-sa-email=${SCHEDULER_SA_EMAIL:}
# Local-dev shared secret (X-Job-Token). Empty = header ignored.
app.jobs.token=${JOBS_TOKEN:}
# In-process @Scheduled fallback. Off by default: Cloud Run scales to zero, Cloud Scheduler
# drives the jobs in production.
app.jobs.inprocess-scheduling=${PULSE_INPROCESS_SCHEDULING:false}
# Base URL of pulse-web, used to build client-view links and "href"s in notices/alerts.
app.web.base-url=${PULSE_WEB_BASE_URL:http://localhost:4202}

# --- Connectors (every one degrades to "not configured" when its vars are absent) ---------
app.ga4.sa-json=${GA4_SA_JSON:}
app.ga4.account-name=${GA4_ACCOUNT_NAME:ROGUETECHNOLOGIES}
app.bookvas.base-url=${BOOKVAS_API_BASE_URL:}
app.bookvas.super-email=${BOOKVAS_SUPER_EMAIL:}
app.bookvas.super-password=${BOOKVAS_SUPER_PASSWORD:}
app.bookvas.project-slug=${BOOKVAS_PROJECT_SLUG:bookvas}
app.netlify.token=${NETLIFY_TOKEN:}
app.gcp.project-id=${GCP_PROJECT_ID:}
app.gcp.region=${GCP_REGION:africa-south1}
app.billing.export-table=${BILLING_EXPORT_TABLE:}
app.github.token=${GITHUB_TOKEN:}
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
app.uptime.timeout-ms=5000

# --- Notifications --------------------------------------------------------------------------
# Spring creates JavaMailSender only when spring.mail.host is set (SPRING_MAIL_HOST etc.).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:Pulse <no-reply@rogue-tech.co.za>}
app.mail.to=${MAIL_TO:}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.to=${WHATSAPP_TO:}

# --- Ask (Anthropic) ------------------------------------------------------------------------
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=${ANTHROPIC_MODEL:claude-opus-5}
app.anthropic.max-tokens=4096

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
management.endpoints.web.exposure.include=health
